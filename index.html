<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Sprite Animation Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-container">
                <img src="logo.png" alt="Pixel Sprite Animation Generator Logo" class="logo">
            </div>
            <h1>Pixel Sprite Animation Generator</h1>
            <p class="tagline">Create game-ready pixel character animations</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <div class="section ai-section">
                    <h2>AI Character Generation</h2>
                    <div class="input-group">
                        <label for="character-description">Character Description:</label>
                        <textarea id="character-description" rows="3" placeholder="Describe your character (e.g. 'A steampunk robot with a top hat and monocle')"></textarea>
                    </div>
                    
                    <div class="input-group">
                        <label>Character Style:</label>
                        <div class="style-options">
                            <label class="radio-label">
                                <input type="radio" name="ai-style" value="cartoon" checked>
                                <span>Cartoon</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="ai-style" value="pixel">
                                <span>Pixel Art</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="ai-style" value="realistic">
                                <span>Realistic</span>
                            </label>
                        </div>
                    </div>
                    
                    <button id="generate-reference" class="primary-button">Generate Reference Image</button>
                    
                    <div id="reference-container" class="reference-container" style="display: none;">
                        <img id="reference-image" alt="AI Generated Reference">
                        <button id="use-reference" class="secondary-button">Use as Reference</button>
                    </div>
                </div>
                
                <div class="section">
                    <h2>Character Configuration</h2>
                    <div class="input-group">
                        <label for="character-type">Character Type:</label>
                        <select id="character-type">
                            <option value="human">Human</option>
                            <option value="fantasy">Fantasy</option>
                            <option value="robot">Robot</option>
                            <option value="animal">Animal</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="pixel-style">Pixel Art Style:</label>
                        <select id="pixel-style">
                            <option value="minimal">Minimal (16x16)</option>
                            <option value="classic" selected>Classic (32x32)</option>
                            <option value="detailed">Detailed (64x64)</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="color-palette">Color Palette:</label>
                        <select id="color-palette">
                            <option value="gameboy">GameBoy (4 colors)</option>
                            <option value="nes">NES (16 colors)</option>
                            <option value="standard" selected>Standard (32 colors)</option>
                        </select>
                    </div>
                </div>
                
                <div class="section">
                    <h2>Animation Settings</h2>
                    <div class="input-group">
                        <label for="animation-type">Animation:</label>
                        <select id="animation-type">
                            <option value="idle">Idle</option>
                            <option value="walk">Walk</option>
                            <option value="run">Run</option>
                            <option value="jump">Jump</option>
                            <option value="attack">Attack</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="frame-count">Frame Count:</label>
                        <input type="range" id="frame-count" min="2" max="12" value="4">
                        <span id="frame-count-value">4</span>
                    </div>
                    
                    <div class="input-group">
                        <label for="animation-speed">Animation Speed:</label>
                        <input type="range" id="animation-speed" min="1" max="30" value="12">
                        <span id="animation-speed-value">12 fps</span>
                    </div>
                </div>
                
                <div class="section">
                    <h2>Actions</h2>
                    <button id="generate-sprite" class="primary-button">Generate Sprite</button>
                    <button id="export-sprite" class="secondary-button" disabled>Export Spritesheet</button>
                </div>
            </div>
            
            <div class="preview-panel">
                <div class="canvas-container">
                    <canvas id="sprite-canvas" width="320" height="320"></canvas>
                </div>
                <div class="animation-controls">
                    <button id="play-pause"><span id="play-pause-icon">⏸️</span></button>
                    <input type="range" id="frame-slider" min="0" max="100" value="0" disabled>
                </div>
                <div class="sprite-info">
                    <p>Size: <span id="sprite-size">32x32</span> | Frames: <span id="sprite-frames">0</span></p>
                </div>
            </div>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {}
    }
    </script>

</body>
</html>
